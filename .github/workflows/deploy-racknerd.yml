name: Deploy to Racknerd

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-racknerd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public site
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.RACKNERD_HOST }}
          username: ${{ secrets.RACKNERD_USER }}
          key: ${{ secrets.RACKNERD_SSH_KEY }}
          port: ${{ secrets.RACKNERD_SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.RACKNERD_APP_PATH }}"
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            export PM2_APP_NAME="${{ secrets.RACKNERD_PM2_NAME }}"
            bash scripts/deploy-racknerd.sh
